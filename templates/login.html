<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Smart Employee Activity Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background: linear-gradient(135deg, #101820 0%, #1f2937 100%);
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e5e7eb;
      }
      .login-card {
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(14px);
        border-radius: 16px;
        padding: 2.5rem;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 45px rgba(0,0,0,0.35);
      }
      label { font-weight: 600; }
      .form-control { border-radius: 10px; padding: 0.75rem 1rem; }
      .btn-login {
        background: #ff4e50;
        border: none;
        border-radius: 10px;
        padding: 0.75rem 1rem;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .hint { font-size: 0.85rem; color: #9ca3af; }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="text-center mb-4">
        <h2 class="fw-bold" style="font-family:'Lora', serif;">Admin Login</h2>
        <p class="hint mb-0">Smart Employee Activity Tracker</p>
      </div>
      <form action="{{ url_for('login') }}" method="post">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control" required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" class="form-control" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-login text-white">Login</button>
        </div>
      </form>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="mt-4">
            {% for category, msg in messages %}
              <div class="alert alert-{{ category }} mb-2">{{ msg }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
