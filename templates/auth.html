{% extends 'base.html' %}
{% block content %}
  <div class="d-flex justify-content-center align-items-center" style="min-height:70vh">
    <div class="card p-4" style="max-width:900px;width:100%">
      <div class="row">
        {% if signup_only %}
        <div class="col-12">
          <h4 class="mb-3">Create admin account</h4>
          <form id="signupForm" action="{{ url_for('signup') }}" method="post">
            <div class="mb-3">
              <label>Name</label>
              <input name="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Email</label>
              <input name="email" type="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Password</label>
              <input name="password" type="password" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Confirm Password</label>
              <input name="confirm" type="password" class="form-control" required>
            </div>
            <div>
              <button class="btn btn-success">Create account</button>
            </div>
          </form>
        </div>
        {% else %}
        <div class="col-md-6 border-end">
          <h4 class="mb-3">Welcome back</h4>
          <form action="{{ url_for('login') }}" method="post">
            <div class="mb-3">
              <label>Email</label>
              <input name="email" type="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Password</label>
              <input name="password" type="password" class="form-control" required>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary">Log in</button>
              <a href="#signup" class="btn btn-outline-secondary" onclick="document.getElementById('signupForm').scrollIntoView({behavior:'smooth'})">Sign up</a>
            </div>
          </form>
        </div>
        <div class="col-md-6">
          <h4 class="mb-3">Create account</h4>
          <form id="signupForm" action="{{ url_for('signup') }}" method="post">
            <div class="mb-3">
              <label>Name</label>
              <input name="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Email</label>
              <input name="email" type="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Password</label>
              <input name="password" type="password" class="form-control" required>
            </div>
            <div class="mb-3">
              <label>Confirm Password</label>
              <input name="confirm" type="password" class="form-control" required>
            </div>
            <div>
              <button class="btn btn-success">Sign up</button>
            </div>
          </form>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
{% endblock %}
